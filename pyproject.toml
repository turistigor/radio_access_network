[project]
name = "radio-network-access"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "sqlalchemy>=2.1.3",
]
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# Какие группы правил проверять
select = ["E", "F", "UP", "B"] 

# Список кодов предупреждений, которые нужно игнорировать
ignore = []

"__init__.py" = ["EXE002"]

"__main__.py" = ["EXE002"]
